# Salin ke .streamlit/secrets.toml HANYA untuk mode kelas; jangan commit rahasia.
[auth]
redirect_uri = "http://localhost:8502/oauth2callback"
cookie_secret = "ganti-dengan-rahasia-acak-panjang"
client_id = "isi-client-id-provider-OIDC"
client_secret = "isi-client-secret-provider-OIDC"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Pemetaan identitas terverifikasi ke ID Telegram yang sudah ada.
# Gunakan nilai iss dan sub persis dari provider yang dipakai.
[ci_users]
"https://accounts.google.com|SUBJECT_DOSEN" = 987654321
"https://accounts.google.com|SUBJECT_MAHASISWA" = 123456789
